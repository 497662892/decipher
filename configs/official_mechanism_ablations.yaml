project:
  seed: 42
  diseases: [cad, bc, T2D]
  n_stage1_oof_folds: 5

paths:
  train_phenotype: data/processed/phenotype.csv
  validation_phenotype: data/processed/official_validation_phenotype.csv
  prs_long_template: outputs/final_tabpfn3_comparison_rerun_inputs/all8/{disease}.train_long.csv
  ancestry_labels: outputs/final_ancestry_1000g/combined/target_1000G_hard_labels_pc10_margin0.5.train_val.tsv
  eligibility_config: configs/disease_eligibility.yaml
  output_root: outputs/official_mechanism_ablations
  model_cache: outputs/tabpfn-model-cache

columns:
  patient_id: sampleid
  disease: disease
  model: model
  score: prs
  ancestry_patient_id: sampleid
  ancestry_group_source: hard_label
  ancestry_group_feature: ancestry_group

prs:
  selection_context: retrospective_post_selection_on_official_validation
  all: [pt, ldpred2, lassosum2, prscs, sdpr, megaprs_noannot, megaprs_annotated, sbayesrc]
  nonannotation: [pt, ldpred2, lassosum2, prscs, sdpr]
  canonical_best_single:
    cad: prscs
    bc: lassosum2
    T2D: megaprs_annotated

metadata:
  sex: sex
  age: age_sd
  pcs: [PC1_sd, PC2_sd, PC3_sd, PC4_sd, PC5_sd, PC6_sd, PC7_sd, PC8_sd, PC9_sd, PC10_sd]
  full: [sex, age_sd, PC1_sd, PC2_sd, PC3_sd, PC4_sd, PC5_sd, PC6_sd, PC7_sd, PC8_sd, PC9_sd, PC10_sd]

tabpfn:
  model_version: v3
  clip_eps: 0.001
  score_scale: train_sd
  disease_settings:
    cad:
      model_path: outputs/tabpfn-model-cache/tabpfn-v3-classifier-v3_default.ckpt
      n_estimators: 16
      balance_probabilities: false
    bc:
      model_path: outputs/tabpfn-model-cache/tabpfn-v3-classifier-v3_20260417_binary.ckpt
      n_estimators: 8
      balance_probabilities: true
    T2D:
      model_path: outputs/tabpfn-model-cache/tabpfn-v3-classifier-v3_default.ckpt
      n_estimators: 16
      balance_probabilities: false

xgboost:
  inner_folds: 3
  n_estimators: 300
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  max_depth: [2, 4, 6]
  learning_rate: [0.03, 0.1]
  min_child_weight: [1, 10]

stage2:
  model: logistic_regression
  solver: lbfgs
  max_iter: 2000
  class_weight: none
  features: [sex, age_sd, PC1_sd, PC2_sd, PC3_sd, PC4_sd, PC5_sd, PC6_sd, PC7_sd, PC8_sd, PC9_sd, PC10_sd, stage1_score]

summary:
  paired_bootstrap_resamples: 2000
  n_jobs: 4
